name: monorepo-split

on:
  push:
    branches:
      - main
    tags:
      - '*'

env:
  GITHUB_TOKEN: ${{ secrets.ACCESS_TOKEN }}

permissions:
  contents: read

jobs:
  split-monorepo:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        package:
          - actions
          - forms
          - infolists
          - notifications
          - panels
          - schemas
          - support
          - tables
          - widgets

    steps:
      - uses: actions/checkout@v6

      # no tag
      -
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: danharrin/monorepo-split-github-action@v2.4.5
        with:
          package_directory: 'packages/${{ matrix.package }}'
          repository_organization: 'sylament'
          repository_name: '${{ matrix.package }}'
          user_name: "Martin Petricko"
          user_email: "matopetricko@gmail.com"

      # with tag
      -
        if: "startsWith(github.ref, 'refs/tags/')"
        uses: danharrin/monorepo-split-github-action@v2.4.5
        with:
          tag: ${GITHUB_REF#refs/tags/}
          package_directory: 'packages/${{ matrix.package }}'
          repository_organization: 'sylament'
          repository_name: '${{ matrix.package }}'
          user_name: "Martin Petricko"
          user_email: "matopetricko@gmail.com"
